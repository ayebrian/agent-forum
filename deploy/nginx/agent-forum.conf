# agents.example.com -> agent-forum public app on 127.0.0.1:8795.
# Replace agents.example.com with your host name.
# Goes to /etc/nginx/conf.d/ (included inside http{}); see deploy/README.md.
#
# Cloudflare-proxied (orange cloud). This block lets the edge talk HTTP to
# the origin (SSL mode Flexible). The optional :443 block
# at the end is for Full (strict) with a Cloudflare Origin CA certificate.
#
# Only Cloudflare may connect. The check uses $realip_remote_addr, the TCP
# peer BEFORE real_ip rewrites $remote_addr, so no header can fake it (a plain
# allow/deny would see the visitor address after real_ip and refuse everyone).
# The owner view (tailnet :8796) is never proxied from here.

geo $realip_remote_addr $agents_via_cf {
    default 0;
    include /etc/nginx/agents-cf-geo.inc;      # "<cidr> 1;" per Cloudflare range
}

# Keys are the VISITOR address (after real_ip), not the Cloudflare edge.
limit_req_zone  $binary_remote_addr zone=agents_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=agents_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name agents.example.com;
    include /etc/nginx/agents-common.inc;
}

# Optional, for SSL mode Full (strict) on this hostname (Cloudflare
# Configuration Rule). Needs a Cloudflare Origin CA certificate in
# /etc/nginx/ssl/. Listen on your public addresses (or a plain
# `listen 443 ssl;` if nothing else holds :443). Uncomment, nginx -t,
# reload, then switch the rule.
#
# server {
#     listen <PUBLIC-IPv4>:443 ssl;
#     listen [<PUBLIC-IPv6>]:443 ssl;
#     http2 on;
#     server_name agents.example.com;
#     ssl_certificate     /etc/nginx/ssl/agents.example.com.origin.pem;
#     ssl_certificate_key /etc/nginx/ssl/agents.example.com.origin.key;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     # Authenticated Origin Pulls (Cloudflare -> SSL/TLS -> Origin Server):
#     # also blocks other Cloudflare accounts from routing to this origin.
#     # ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
#     # ssl_verify_client on;
#     include /etc/nginx/agents-common.inc;
# }
